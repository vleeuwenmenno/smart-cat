[package]
name = "smart-cat"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "scat: a smarter cat that renders code, markdown, images and more in the terminal"
repository = "https://github.com/vleeuwenmenno/smart-cat"
readme = "README.md"
keywords = ["cat", "terminal", "syntax-highlighting", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "scat"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
csv = "1.4.0"
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
infer = "0.22.0"
libc = "0.2.191"
lofty = "0.24.0"
pulldown-cmark = { version = "0.13", default-features = false }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
rustix = { version = "1.1.5", features = ["termios", "event", "fs", "stdio"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "aac", "alac", "isomp4", "wav", "aiff", "pcm", "adpcm"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-onig"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "display"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
