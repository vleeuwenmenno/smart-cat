[package]
name = "smart-cat"
version = "0.1.0-rc.3"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "scat: a smarter cat that renders code, markdown, images and more in the terminal"
repository = "https://github.com/vleeuwenmenno/smart-cat"
readme = "README.md"
keywords = ["cat", "terminal", "syntax-highlighting", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "scat"
path = "src/main.rs"

[dependencies]
brotli-decompressor = "5.0.3"
bzip2 = "0.6.1"
calamine = "0.36"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
csv = "1.4.0"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
goblin = { version = "0.10", default-features = false, features = ["std", "elf32", "elf64", "mach32", "mach64", "pe32", "pe64", "te", "archive", "endian_fd"] }
hayro = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
infer = "0.22.0"
libc = "0.2.191"
layout-rs = "0.1.3"
lofty = "0.24.0"
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
cfb = "0.14.0"
pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = "0.41"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
rustix = { version = "1.1.5", features = ["termios", "event", "fs", "stdio", "process", "pipe"] }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std", "hash"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.20.2", default-features = false }
sha1 = "0.11.0"
sha2 = "0.11.1"
skrifa = "0.46.2"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "aac", "alac", "isomp4", "wav", "aiff", "pcm", "adpcm"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-onig"] }
tar = { version = "0.4.46", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "display"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2.2"
wasmparser = { version = "0.262", default-features = false, features = ["std", "features", "component-model"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
x509-parser = "0.18.1"

[dev-dependencies]
sevenz-rust2 = { version = "0.20.2", default-features = false, features = ["compress"] }
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz", "encoder"] }
cfb = "0.14.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
