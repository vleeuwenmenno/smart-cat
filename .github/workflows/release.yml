name: Release

# Push a tag to publish: v1.2.3 becomes a release, v1.2.3-rc.1 (any tag with a "-")
# becomes a pre-release. `make bump VERSION=...` creates the commit and tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: make test
      - name: Build release archive
        run: make dist TARGET=${{ matrix.target }} DIST_CC=musl-gcc
      - name: Smoke test
        run: |
          tar -xzf dist/scat-${{ matrix.target }}.tar.gz -C dist scat
          ./dist/scat --version
          printf 'a\n\n\nb\n' | ./dist/scat -ns
      - uses: actions/upload-artifact@v4
        with:
          name: scat-${{ matrix.target }}
          path: |
            dist/scat-${{ matrix.target }}.tar.gz
            dist/scat-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--verify-tag --generate-notes --title $GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in
            *-*) flags="$flags --prerelease --latest=false" ;;
            *) flags="$flags --latest" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" $flags dist/*.tar.gz dist/*.sha256
